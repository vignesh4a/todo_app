name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (install this on your phone)
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: todo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Runs only once you've added the signing secrets (see README).
      - name: Build signed release bundle for Google Play
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: todo-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
